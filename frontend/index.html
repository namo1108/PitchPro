<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1410" />
  <title>PITCH PRO</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">P</span>
        <span class="brand-name">PITCH<span class="brand-accent">PRO</span></span>
      </div>
    </header>

    <main class="content">
      <!-- 경기 -->
      <section id="view-matches" class="view active">
        <div class="date-nav">
          <button id="prev-day" class="date-arrow" aria-label="이전 날짜">‹</button>
          <div class="date-label" id="current-date-label">오늘</div>
          <button id="next-day" class="date-arrow" aria-label="다음 날짜">›</button>
          <button id="refresh-btn" class="refresh-btn" title="새로고침">⟳</button>
        </div>
        <div id="matches-list" class="matches-list">
          <div class="loading">경기 정보를 불러오는 중...</div>
        </div>
      </section>

      <!-- 최신뉴스 -->
      <section id="view-news" class="view">
        <h2 class="section-title">최신뉴스</h2>
        <div id="news-list" class="news-list">
          <div class="loading">뉴스를 불러오는 중...</div>
        </div>
      </section>

      <!-- 리그(순위) -->
      <section id="view-leagues" class="view">
        <div class="competition-picker" id="competition-picker"></div>
        <div id="standings-table-wrap" class="standings-table-wrap">
          <div class="loading">순위를 불러오는 중...</div>
        </div>
      </section>

      <!-- AI 분석 -->
      <section id="view-ai" class="view">
        <h2 class="section-title">AI 분석</h2>
        <div id="ai-list" class="ai-list">
          <div class="loading">분석을 불러오는 중...</div>
        </div>
      </section>

      <!-- 나의 팀 -->
      <section id="view-myteam" class="view">
        <h2 class="section-title">나의 팀</h2>
        <button id="notify-btn" class="notify-btn">🔔 골 알림 받기</button>
        <div id="myteam-list" class="myteam-list">
          <div class="empty-state">팀 상세 화면에서 ★를 눌러 즐겨찾기하세요.</div>
        </div>
      </section>

      <!-- 경기 상세 -->
      <section id="view-detail" class="view">
        <button class="back-btn" data-back-to="matches">← 목록으로</button>
        <div id="match-detail-content" class="match-detail-content">
          <div class="loading">불러오는 중...</div>
        </div>
      </section>

      <!-- 팀 상세 -->
      <section id="view-team" class="view">
        <button class="back-btn" data-back-to="matches">← 목록으로</button>
        <div id="team-detail-content" class="team-detail-content">
          <div class="loading">불러오는 중...</div>
        </div>
      </section>
      <footer class="app-footer">
        데이터 제공: <a href="https://www.football-data.org" target="_blank" rel="noopener">football-data.org</a>,
        <a href="https://www.thesportsdb.com" target="_blank" rel="noopener">TheSportsDB</a>,
        <a href="https://www.bbc.co.uk/sport/football" target="_blank" rel="noopener">BBC Sport</a>
      </footer>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-view="matches">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/></svg>
        <span>경기</span>
      </button>
      <button class="nav-btn" data-view="news">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h13v14a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2z"/><path d="M17 4h3v15a1 1 0 0 1-1 1"/><path d="M7 8h7M7 11h7M7 14h4"/></svg>
        <span>최신뉴스</span>
      </button>
      <button class="nav-btn" data-view="leagues">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 21h8M12 17v4"/><path d="M6 4h12v4a6 6 0 0 1-12 0z"/><path d="M6 6H3v1a4 4 0 0 0 3 3.87M18 6h3v1a4 4 0 0 1-3 3.87"/></svg>
        <span>리그</span>
      </button>
      <button class="nav-btn" data-view="ai">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.6 4.2L18 9l-4.4 1.8L12 15l-1.6-4.2L6 9l4.4-1.8z"/><path d="M19 15l.7 1.8L21.5 17.5l-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg>
        <span>AI 분석</span>
      </button>
      <button class="nav-btn" data-view="myteam">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
        <span>나의 팀</span>
      </button>
    </nav>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
